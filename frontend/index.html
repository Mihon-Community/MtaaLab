<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5d58" />
    <script>
      // Apply saved display preferences before first paint to avoid a theme flash.
      (function () {
        try {
          var raw = localStorage.getItem("mtaalab.ui-preferences");
          var prefs = raw ? JSON.parse(raw) : {};
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var mode =
            prefs.mode === "light" ||
            prefs.mode === "dark" ||
            prefs.mode === "system"
              ? prefs.mode
              : "system";
          var resolved = mode === "system" ? (dark ? "dark" : "light") : mode;
          var moreContrast = window.matchMedia(
            "(prefers-contrast: more)",
          ).matches;
          var contrast =
            prefs.contrast === "high" || (!prefs.contrast && moreContrast)
              ? "high"
              : "standard";
          var scale =
            typeof prefs.textScale === "number"
              ? Math.min(1.25, Math.max(0.9, prefs.textScale))
              : 1;
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.classList.toggle("dark", resolved === "dark");
          root.dataset.contrast = contrast;
          root.style.setProperty("--text-scale", String(scale));
          root.dataset.motion = prefs.motion === "reduce" ? "reduce" : "system";
          root.style.colorScheme = resolved;
        } catch (error) {
          /* Preferences are cosmetic; never block rendering. */
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>MtaaLab — The Living World Simulator</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
